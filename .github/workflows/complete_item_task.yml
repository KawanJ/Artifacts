name: Complete Item Task

on:
  workflow_dispatch:
    inputs:
      character_name:
        description: 'Character to run the item task as (defaults to the configured character)'
        required: false
        type: string

jobs:
  complete-item-task:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run item task
        env:
          ARTIFACTS_API_KEY: ${{ secrets.ARTIFACTS_API_KEY }}
          ITEM_TASK_CHARACTER_NAME: ${{ inputs.character_name }}
        run: python scripts/complete_item_task.py
